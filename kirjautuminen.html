
<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Kirjautuminen</title>

<style>
body {
    background: #eee;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login {
    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 250px;
    text-align: center;
}

input, button {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    box-sizing: border-box;
}

button {
    background: blue;
    color: white;
    border: none;
    cursor: pointer;
}

#message {
    color: green;
}
</style>
</head>

<body>

<div class="login">
    <h2>Kirjaudu</h2>

    <input id="email" type="email" placeholder="Sähköposti">
    <input id="password" type="password" placeholder="Salasana">

    <button id="register">Rekisteröidy</button>
    <button id="login">Kirjaudu sisään</button>

    <p id="message"></p>
</div>

<script>
const message = document.getElementById('message');

document.getElementById('register').onclick = () => {
    message.textContent = 'Rekisteröityminen onnistui!';
};

document.getElementById('login').onclick = () => {
    message.textContent = 'Kirjautuminen onnistui!';
};
</script>

</body>
</html>
