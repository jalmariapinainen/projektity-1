            },

                salasana: salasana
                
            })
        });

        const data = await vastaus.json();

            message.style.color = "red";
            message.textContent = data.message || "Kirjautuminen epäonnistui.";
            return;
        }

        message.style.color = "green";

        console.error(error);
    }
};

    <script>
        // Funktio lähettää kirjautumis- tai rekisteröitymispyynnön
        async function lahetaPyynto(tarkoitus) {
            const form = document.getElementById("authForm");
            if (!form.reportValidity()) {
                return;
            }

            // Näytetään viesti käyttäjälle
            const viesti = document.getElementById("message");
            const tiedot = {
                tarkoitus,
                kayttajatunnus: document.getElementById("email").value.trim(),
                salasana: document.getElementById("password").value
            };

            // Lisätään puhelinnumero vain rekisteröitymisen yhteydessä
            if (tarkoitus === "kayttajaLisays") {
                tiedot.puhelinnumero = document.getElementById("phone").value.trim();
            }

            viesti.textContent = "Käsitellään...";

            // Lähetetään pyyntö palvelimelle
            try {
                const response = await fetch("api.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify(tiedot)
                });
                // Tarkistetaan, että vastaus on JSON-muodossa
                const contentType = response.headers.get("content-type") || "";
                if (!contentType.includes("application/json")) {
                    throw new Error(
                        "API ei palauta JSON-vastausta. Avaa sivu Dockerista osoitteesta http://localhost:8080/kirjautuminen.html."
                    );
                }
                // Parsitaan JSON-vastaus
                const data = await response.json();

                // Tarkistetaan, onko pyyntö onnistunut
                if (!response.ok) {
                    throw new Error(data.message || "Pyyntö epäonnistui.");
                }

                // Näytetään onnistumisviesti
                viesti.textContent = data.message || "Pyyntö onnistui.";
            } catch (error) {
                viesti.textContent = error instanceof Error
                    ? error.message
                    : "Palvelimeen ei saatu yhteyttä.";
            }
        }

        // Lisätään tapahtumankuuntelijat painikkeille
        document.getElementById("register").addEventListener("click", () => {
            lahetaPyynto("kayttajaLisays");
        });
        document.getElementById("login").addEventListener("click", () => {
            lahetaPyynto("kirjautuminen");
        });
    </script>
