
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profiili</title>

    <style>
        :root {
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: #172033;
            background: #f3f6fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at top left, #e1eaff 0, transparent 42%),
                #f3f6fb;
        }

        .profile-card {
            width: min(100%, 460px);
            padding: 40px;
            border: 1px solid #e6eaf1;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 20px 55px rgba(27, 44, 75, 0.1);
            text-align: center;
        }

        .profile-avatar {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #e9efff;
            color: #3559c7;
            font-size: 30px;
            font-weight: 700;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #61708a;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.14em;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 6vw, 36px);
        }

        h2 {
            margin-top: 25px;
        }

        .description {
            margin: 12px 0 28px;
            color: #69758a;
            font-size: 15px;
            line-height: 1.6;
        }

        .actions {
            display: grid;
            gap: 12px;
        }

        button {
            width: 100%;
            min-height: 48px;
            padding: 12px 18px;
            border: 1px solid transparent;
            border-radius: 10px;
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        #change, #save {
            background: #3559c7;
            color: white;
        }

        #change:hover, #save:hover {
            background: #2949ab;
        }

        #logout, #cancel {
            border-color: #dce2ec;
            background: white;
            color: #344158;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #dce2ec;
            border-radius: 8px;
            font: inherit;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        #passwordForm {
            display: none;
            margin-top: 20px;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .profile-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>

<main class="profile-card">

    <div class="profile-avatar" aria-hidden="true">P</div>

    <p class="eyebrow">OMA TILI</p>

    <h1>Profiili</h1>

    <p class="description">
        Hallitse tiliäsi ja sen asetuksia.
    </p>

    <div class="actions">

        <button id="change" type="button">
            Vaihda salasana
        </button>

        <button id="logout" type="button">
            Kirjaudu ulos
        </button>

    </div>

    <!-- Salasanan vaihtolomake -->

    <form id="passwordForm">

        <h2>Vaihda salasana</h2>

        <label for="oldPassword">Nykyinen salasana</label>
        <input
            type="password"
            id="oldPassword"
            placeholder="Nykyinen salasana"
            required
        >

        <label for="newPassword">Uusi salasana</label>
        <input
            type="password"
            id="newPassword"
            placeholder="Uusi salasana"
            minlength="8"
            required
        >

        <label for="confirmPassword">Vahvista uusi salasana</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Vahvista uusi salasana"
            required
        >

        <button type="submit" id="save">
            Tallenna uusi salasana
        </button>

        <button type="button" id="cancel">
            Peruuta
        </button>

    </form>

    <p id="message" role="status"></p>

</main>


<script>

// API:n osoite.
// Profiili.html on projektisi juuressa ja api.php src-kansiossa.
const API_URL = "src/api.php";

const message = document.getElementById("message");
const form = document.getElementById("passwordForm");


// AVAA SALASANAN VAIHTO

document.getElementById("change").addEventListener("click", function() {

    form.style.display = "block";

    message.textContent = "";

});


// PERUUTA SALASANAN VAIHTO

document.getElementById("cancel").addEventListener("click", function() {

    form.style.display = "none";

    form.reset();

    message.textContent = "";

});


// TALLENNA UUSI SALASANA

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const nykyinen = document.getElementById("oldPassword").value;
    const uusi = document.getElementById("newPassword").value;
    const vahvista = document.getElementById("confirmPassword").value;

    if (uusi.length < 8) {

        message.style.color = "red";
        message.textContent = "Salasanan pitää olla vähintään 8 merkkiä.";

        return;
    }

    if (uusi !== vahvista) {

        message.style.color = "red";
        message.textContent = "Salasanat eivät täsmää!";

        return;
    }

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            credentials: "same-origin",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                tarkoitus: "salasanaVaihto",

                nykyinenSalasana: nykyinen,

                uusiSalasana: uusi

            })

        });

        const data = await response.json();

        if (response.ok) {

            message.style.color = "green";

            message.textContent = data.message;

            form.reset();

            form.style.display = "none";

        } else {

            message.style.color = "red";

            message.textContent = data.message || "Salasanan vaihtaminen epäonnistui.";

        }

    } catch (error) {

        message.style.color = "red";

        message.textContent = "Yhteys APIin epäonnistui.";

        console.error(error);

    }

});


// KIRJAUDU ULOS

document.getElementById("logout").addEventListener("click", async function() {

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            credentials: "same-origin",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                tarkoitus: "ulos"

            })

        });

        if (response.ok) {

            window.location.href = "src/kirjautuminen.html";

        } else {

            message.style.color = "red";
            message.textContent = "Uloskirjautuminen epäonnistui.";

        }

    } catch (error) {

        message.style.color = "red";
        message.textContent = "Yhteys APIin epäonnistui.";

        console.error(error);

    }

});

</script>

</body>
</html>
